name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Memory Catalog CLA and I hereby sign it') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned to commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/donalddominko/Memory-Catalog/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: donalddominko,bot*
          custom-pr-sign-comment: 'I have read the Memory Catalog CLA and I hereby sign it'
          create-file-commit-message: 'Create file for storing CLA signatures'
          signed-commit-message: '$contributorName signed the CLA in $owner/$repo#$pullRequestNo'
